[Rainmeter]
Update=1000
Author=Connect-R
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
LeftMouseDoubleClickAction=!ToggleConfig "Simplony\Settings" "Settings.ini"
OnDesktop=1

[Variables]
@include=#@#Variables.inc
@include2=#@#Language\#Language#.inc

; ---- Your knobs: change only these ----
UserName=Khang Tran
Scale=1
WidgetWidth=700
Gap=4

;-------------------------------------------------------------
; MEASURES
;-------------------------------------------------------------
[MeasureTime12]
Measure=Time
Format=%I:%M:%S

[MeasureAMPM]
Measure=Time
Format=%p

[MeasureDate]
Measure=Time
Format=%A, %d %B
Substitute=#Date#

;-------------------------------------------------------------
; METERS (stacked top to bottom, each relative to the previous)
;-------------------------------------------------------------
[MeterGreeting]
Meter=String
StringAlign=Center
FontColor=255,255,255,220
FontFace=Montserrat Thin
FontSize=(55 * #Scale#)
FontWeight=100
X=(#WidgetWidth# / 2)
Y=0
Text="Good day, #UserName#!"
AntiAlias=1

[MeterClock12h]
Meter=String
MeasureName=MeasureTime12
MeasureName2=MeasureAMPM
StringAlign=Center
FontColor=255,255,255
FontFace=Montserrat Thin
FontWeight=100
FontSize=(30 * #Scale#)
; Spacing on digits only
InlineSetting=CharacterSpacing | 1 | 1
InlinePattern=\d
; Colons keep normal spacing, with a small nudge so they sit centered
InlineSetting2=CharacterSpacing | 0 | 0
InlinePattern2=:
X=(#WidgetWidth# / 2)
Y=(#Gap# * #Scale#)R
Text="%1 %2"
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
StringAlign=Center
FontColor=255,255,255,150
FontFace=Montserrat Light
FontSize=(20 * #Scale#)
X=(#WidgetWidth# / 2)
Y=(#Gap# * #Scale#)R
Text="%1"
AntiAlias=1